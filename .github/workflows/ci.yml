name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  # ── 编译 + 静态检查 ──────────────────────────────────────────────────────
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod tidy
      - run: go build ./...
      - run: go test ./...

  # ── tutorial 集成测试（需要 Redis）────────────────────────────────────────
  tutorial-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod tidy
      - run: go build -o kvlang ./cmd/kvlang/
      # 从 go.mod 钉住的版本构建 CLI，不能用 @latest —— 唯一的 tag v0.1.0
      # 与本仓库的 API 及值编码都不同源
      - run: go build -o /usr/local/bin/kvspace github.com/array2d/kvspace-go/cmd/kvspace
      - run: python3 -m unittest tutorial.test.BenchmarkTest
      - run: python3 tutorial/test.py
      # 委托 rwir 的跨进程验收：go test 里的执行器是同进程 goroutine，
      # 只有真起两个进程才验得到 CLI 值编码、参数顺序、键布局
      - run: PORT=6379 sh examples/delegate/run.sh

  # ── 多平台交叉编译（仅 tag 时生成 release 产物）─────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Cross-compile
        run: |
          go mod tidy
          mkdir -p dist
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              echo "Building $GOOS/$GOARCH..."
              GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o dist/kvlang-$GOOS-$GOARCH ./cmd/kvlang/
            done
          done
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
